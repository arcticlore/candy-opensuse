name: logrotate
# CONTAINMENT: ежедневный schedule и прямой push в master отключены.
# Запуск только вручную; изменения — через bot branch + reviewable PR.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Rotate logs
        run: |
          find logs/ -name "*.log" -size +10M -exec truncate -s 1M {} \;
          find logs/runs/ -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
          find SRPMS/ -name "*.src.rpm" -mtime +30 -delete 2>/dev/null || true

      - name: Commit via bot branch + reviewable PR (no direct push to master)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add -A logs/ SRPMS/ || true
          if ! git diff --cached --quiet; then
            BRANCH="candy-bot/logrotate-${GITHUB_RUN_ID}"
            git checkout -qb "$BRANCH" 2>/dev/null || git switch -c "$BRANCH"
            git commit -qm "logrotate [skip ci]"
            git push origin "HEAD:$BRANCH" 2>&1 | tail -3
            gh pr create --base master --head "$BRANCH" \
              --title "logrotate cleanup" \
              --body "Autogenerated log/SRPM cleanup. Reviewable PR — no direct push to master." \
              2>&1 | tail -2 || echo "PR create failed (non-critical)"
          fi