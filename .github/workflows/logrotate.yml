name: logrotate
# CONTAINMENT: ежедневный schedule и прямой push в master отключены.
# Запуск только вручную; изменения — через bot branch + reviewable PR.
on:
  workflow_dispatch:

# Единственный токен — встроенный run-scoped GITHUB_TOKEN.
#   contents: write      — push ветки candy-bot/* (прямой push в master запрещён);
#   pull-requests: write — gh pr create;
#   actions: write       — явный dispatch validate.yml (PR от GITHUB_TOKEN сам CI не триггерит).
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Rotate logs
        run: |
          find logs/ -name "*.log" -size +10M -exec truncate -s 1M {} \;
          find logs/runs/ -mindepth 1 -maxdepth 1 -type d -mtime +7 -exec rm -rf {} \;
          find SRPMS/ -name "*.src.rpm" -mtime +30 -delete 2>/dev/null || true

      - name: Commit via bot branch + reviewable PR (no direct push to master)
        env:
          # Личный PAT больше не читается ни одним workflow: единственный
          # токен — встроенный run-scoped GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add -A logs/ SRPMS/ || true
          if ! git diff --cached --quiet; then
            BRANCH="candy-bot/logrotate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git checkout -qb "$BRANCH" 2>/dev/null || git switch -c "$BRANCH"
            git commit -qm "logrotate"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # Прямой push в master запрещён — писать можно только в candy-bot/*.
            case "$BRANCH" in
              candy-bot/*) ;;
              *)
                echo "ERROR: '$BRANCH' вне префикса candy-bot/* — push запрещён" >&2
                exit 1 ;;
            esac
            if ! git push origin "HEAD:$BRANCH"; then
              echo "ERROR: git push failed for $BRANCH" >&2
              exit 1
            fi
            if ! gh pr create --base master --head "$BRANCH" \
                 --title "logrotate cleanup" \
                 --body "Autogenerated log/SRPM cleanup. Reviewable PR — no direct push to master."; then
              echo "ERROR: gh pr create failed for $BRANCH" >&2
              exit 1
            fi
            # GITHUB_TOKEN-PR сам CI не триггерит — dispatch validate ЯВНО
            # на точной bot-ветке, привязанный к head SHA только что созданного PR.
            HEAD_SHA=$(git rev-parse HEAD)
            python3 bin/merge_gate.py dispatch \
              --workflow validate.yml \
              --branch "$BRANCH" \
              --head-sha "$HEAD_SHA" \
              --repo "$GITHUB_REPOSITORY"
          fi
