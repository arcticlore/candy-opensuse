name: Update openSUSE pilot→stable packages

# Весь run сериализуется: две одновременные волны построят дубли и будут
# драться за одни и те же chroot. cancel-in-progress:false — текущая волна
# дорабатывается, следующая ждёт в очереди (и продолжает её по build id).
concurrency:
  group: opensuse-auto-publish
  cancel-in-progress: false

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_wave:
        description: "Максимум пакетов в волне (1..25)"
        required: false
        default: "5"
      full_rebuild:
        description: "Полный ребилд (только allowlist + двойное подтверждение)"
        type: boolean
        required: false
        default: false
      confirm_full_rebuild:
        description: "Подтверждаю полный ребилд"
        type: boolean
        required: false
        default: false
      stable_project:
        description: "Stable COPR-проект"
        required: false
        default: "arcticlore/candy-opensuse"
      pilot_project:
        description: "Pilot COPR-проект"
        required: false
        default: "arcticlore/candy-opensuse-pilot"

permissions:
  contents: write
  pull-requests: write
  issues: write

# Акторам, кому разрешён ручной полный ребилд (--force).
# Всё, что не входит в список, упирается в abort до любых submit.
env:
  MAINTAINER_ALLOWLIST: "arcticlore"

jobs:
  # ---------------------------------------------------------------------------
  # 1. План: быстрый, без submit. Определяет СПИСОК пакетов для матрицы.
  # ---------------------------------------------------------------------------
  plan:
    name: plan wave
    runs-on: ubuntu-latest
    # План не ждёт COPR — только repodata. 60 минут с большим запасом.
    timeout-minutes: 60
    container: fedora:44
    # Fallback обязателен: отдельный шаг со своим GITHUB_OUTPUT не может
    # записать в outputs шага id=plan, поэтому «страховка» раньше ничего не
    # делала. Выражение же отработает и когда plan упал до записи, и когда
    # строка вышла пустой — matrix получит валидный JSON в обоих случаях.
    outputs:
      packages: ${{ steps.plan.outputs.packages || '[]' }}
      plan_size: ${{ steps.plan.outputs.plan_size || '0' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Scope check (allowlists + emergency brake + force confirm)
        id: scope
        env:
          # На schedule контекст inputs пуст — задаём ЯВНЫЕ значения по умолчанию,
          # иначе scope-check падал на пустом max_wave (P1: schedule был мёртв).
          FORCE: ${{ inputs.full_rebuild == true }}
          CONFIRM_FULL: ${{ inputs.confirm_full_rebuild == true }}
          MAX_WAVE: ${{ inputs.max_wave || '5' }}
          STABLE_PROJECT: ${{ inputs.stable_project || 'arcticlore/candy-opensuse' }}
          PILOT_PROJECT: ${{ inputs.pilot_project || 'arcticlore/candy-opensuse-pilot' }}
          CANDY_PUBLISH_PAUSE: ${{ vars.CANDY_PUBLISH_PAUSE }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "${CANDY_PUBLISH_PAUSE:-false}" = "true" ]; then
            echo "ABORT: repo variable CANDY_PUBLISH_PAUSE=true (emergency brake)" >&2
            exit 1
          fi
          if [ "$STABLE_PROJECT" != "arcticlore/candy-opensuse" ]; then
            echo "ABORT: STABLE_PROJECT=$STABLE_PROJECT вне allowlist" >&2
            exit 1
          fi
          if [ "$PILOT_PROJECT" != "arcticlore/candy-opensuse-pilot" ]; then
            echo "ABORT: PILOT_PROJECT=$PILOT_PROJECT вне allowlist" >&2
            exit 1
          fi
          # Полный ребилд не может быть unattended: только workflow_dispatch,
          # только из allowlist, только с явным двойным подтверждением.
          if [ "$FORCE" = "true" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "ABORT: full_rebuild невозможен вне workflow_dispatch (событие: $EVENT_NAME)" >&2
            exit 1
          fi
          if [ "$FORCE" = "true" ]; then
            case ",$MAINTAINER_ALLOWLIST," in
              *",$ACTOR,"*) : ;;
              *) echo "ABORT: actor=$ACTOR не в MAINTAINER_ALLOWLIST — полный ребилд запрещён" >&2
                 exit 1 ;;
            esac
          fi
          if [ "$FORCE" = "true" ] && [ "$CONFIRM_FULL" != "true" ]; then
            echo "ABORT: full_rebuild=true требует confirm_full_rebuild=true" >&2
            exit 1
          fi
          case "$MAX_WAVE" in
            ''|*[!0-9]*) echo "ABORT: max_wave должен быть числом ($MAX_WAVE)" >&2; exit 1 ;;
          esac
          if [ "$MAX_WAVE" -lt 1 ] || [ "$MAX_WAVE" -gt 25 ]; then
            echo "ABORT: max_wave вне диапазона 1..25 (получили $MAX_WAVE)" >&2
            exit 1
          fi
          FORCE_FLAG=""
          [ "$FORCE" = "true" ] && FORCE_FLAG="--force"
          echo "force_flag=$FORCE_FLAG" >> "$GITHUB_OUTPUT"
          echo "max_wave=$MAX_WAVE" >> "$GITHUB_OUTPUT"
          echo "SCOPE_OK wave=$MAX_WAVE force=${FORCE:-false}"

      - name: Install toolchain
        run: |
          set -euo pipefail
          mkdir -p logs
          dnf install -y jq git gh rpm-build rpmdevtools dnf-plugins-core python3 golang \
            cargo rust copr-cli nodejs24 nodejs24-npm-bin > logs/dnf-install.log 2>&1 \
            || { echo "dnf install failed:"; tail -20 logs/dnf-install.log; exit 1; }
          tail -5 logs/dnf-install.log
          gh --version
          mv logs/dnf-install.log logs/dnf-install-full.log

      - name: Configure COPR
        run: |
          set -euo pipefail
          COPR_CONF="$RUNNER_TEMP/copr-publish.conf"
          umask 077
          printf '%s\n' "${{ secrets.COPR_CONFIG }}" > "$COPR_CONF"
          chmod 600 "$COPR_CONF"
          echo "COPR_CONFIG_PATH=$COPR_CONF" >> "$GITHUB_ENV"
          echo "COPR config: $COPR_CONF ($(wc -c < "$COPR_CONF") bytes)"
          # API token для copr_waiter (чтение chroot-состояний).
          if [ -n "${{ secrets.COPR_API_TOKEN }}" ]; then
            echo "${{ secrets.COPR_API_TOKEN }}" > "$RUNNER_TEMP/copr-api-token"
            chmod 600 "$RUNNER_TEMP/copr-api-token"
            echo "COPR_API_TOKEN_PATH=$RUNNER_TEMP/copr-api-token" >> "$GITHUB_ENV"
          fi

      - name: Generate specs (из pkgs.json; идемпотентный)
        run: python3 bin/gen_specs.py --all

      - name: Refresh upstream versions (цели волны из state.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bin/coprase-status.py versions 2>&1 | tee logs/versions.log

      - name: Restore SRPM cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            SRPMS/
            SOURCES/
          # Ключ = хэш источников правды, от которых зависит содержимое SRPM.
          # restore-keys намеренно НЕТ: стейл-SRPM недопустим.
          key: srpm-cache-${{ hashFiles('pkgs.json', 'bin/gen_specs.py', 'bin/make-srpm.sh') }}
          enableCrossOsArchive: true

      - name: Build wave plan (без submit)
        id: plan
        env:
          COPR_STABLE: ${{ inputs.stable_project || 'arcticlore/candy-opensuse' }}
          COPR_PILOT: ${{ inputs.pilot_project || 'arcticlore/candy-opensuse-pilot' }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
          WAVE_MAX: ${{ steps.scope.outputs.max_wave }}
        run: |
          set -o pipefail
          python3 bin/auto-publish.py plan --max-wave "$WAVE_MAX" \
            ${{ steps.scope.outputs.force_flag }} --json-out logs/plan.json 2>&1 | tee logs/plan.log
          # В матрицу уходят ЦЕЛЫЕ записи плана, а не только имена: package-job
          # получает name+target+mode+id сборок и исполняет их как иммутабельный
          # --plan-entry. Раньше каждый job перестраивал план из живого
          # state.json, и план мог уехать между jobs.
          PKGS=$(python3 -c "import json;print(json.dumps(json.load(open('logs/plan.json'))['packages']))")
          SIZE=$(python3 -c "import json;print(json.load(open('logs/plan.json'))['plan_size'])")
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"
          echo "plan_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "wave matrix: $PKGS"

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wave-plan-${{ github.run_number }}
          path: logs/

  # ---------------------------------------------------------------------------
  # 2. Пакеты волны: независимые job'ы, максимум 3 одновременно.
  #
  #    Почему не один job: run 36971434567 отменили на 320-минутном
  #    таймауте, и четыре пакета, ушедшие в stable, потеряли результат вместе с
  #    ним. Теперь пакет = отдельный job, и его таймаут не трогает соседей.
  # ---------------------------------------------------------------------------
  package:
    name: publish ${{ matrix.pkg.name }}
    needs: plan
    # Гоняем только при УСПЕХЕ plan и непустой матрице. Раньше здесь не было
    # проверки needs.plan.result: упавший plan оставлял packages='' и строка
    # fromJSON('') падала с непонятной ошибкой вместо аккуратного skip.
    if: needs.plan.result == 'success' && needs.plan.outputs.packages != '[]'
    runs-on: ubuntu-latest
    # Потолок 360 минут. Наблюдение за COPR живёт в --timeout-min 300, и
    # бюджет поделён между pilot и stable внутри одного пакета, поэтому после
    # наблюдения остаётся ~60 минут: записать отчёт, выставить deferred и
    # залить артефакты ДО того, как job добьёт GitHub. Именно поэтому
    # deferred доходит до reconcile, а не отменяется таймаутом job'а.
    timeout-minutes: 360
    container: fedora:44
    strategy:
      # Один упавший пакет не должен отменять остальные: они всё ещё могут
      # закрыться, а их state-sync нужен.
      fail-fast: false
      max-parallel: 3
      matrix:
        pkg: ${{ fromJSON(needs.plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          set -euo pipefail
          mkdir -p logs
          dnf install -y jq git gh rpm-build rpmdevtools dnf-plugins-core python3 golang \
            cargo rust copr-cli nodejs24 nodejs24-npm-bin > logs/dnf-install.log 2>&1 \
            || { echo "dnf install failed:"; tail -20 logs/dnf-install.log; exit 1; }
          tail -5 logs/dnf-install.log
          gh --version
          mv logs/dnf-install.log logs/dnf-install-full.log

      - name: Configure COPR
        run: |
          set -euo pipefail
          COPR_CONF="$RUNNER_TEMP/copr-publish.conf"
          umask 077
          printf '%s\n' "${{ secrets.COPR_CONFIG }}" > "$COPR_CONF"
          chmod 600 "$COPR_CONF"
          echo "COPR_CONFIG_PATH=$COPR_CONF" >> "$GITHUB_ENV"
          if [ -n "${{ secrets.COPR_API_TOKEN }}" ]; then
            echo "${{ secrets.COPR_API_TOKEN }}" > "$RUNNER_TEMP/copr-api-token"
            chmod 600 "$RUNNER_TEMP/copr-api-token"
            echo "COPR_API_TOKEN_PATH=$RUNNER_TEMP/copr-api-token" >> "$GITHUB_ENV"
          fi

      - name: Restore SRPM cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            SRPMS/
            SOURCES/
          key: srpm-cache-${{ hashFiles('pkgs.json', 'bin/gen_specs.py', 'bin/make-srpm.sh') }}
          enableCrossOsArchive: true

      # Активная сборка той же версии НЕ пересобирается: auto-publish подхватит
      # существующий build id через active_build и продолжит наблюдение.
      # Активная сборка ДРУГОЙ версии не переиспользуется никогда.
      - name: Publish single package (resume existing build id, no resubmit)
        id: exec
        env:
          PKG: ${{ matrix.pkg.name }}
          COPR_STABLE: ${{ inputs.stable_project || 'arcticlore/candy-opensuse' }}
          COPR_PILOT: ${{ inputs.pilot_project || 'arcticlore/candy-opensuse-pilot' }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
          # Иммутабельная запись плана из plan-job: name, target, mode и id
          # существующих сборок. auto-publish НЕ перестраивает план по живому
          # state.json — исполняет ровно то, что было решено в plan-job.
          WAVE_PLAN_ENTRY: ${{ toJSON(matrix.pkg) }}
          WAVE_REPORT_PATH: logs/report-${{ matrix.pkg.name }}.json
          PKG_TIMEOUT_MIN: "300"
        run: |
          set +e
          python3 bin/auto-publish.py run \
            --plan-entry "$WAVE_PLAN_ENTRY" \
            --report-path "logs/report-$PKG.json" \
            --timeout-min "$PKG_TIMEOUT_MIN" 2>&1 | tee "logs/publish-$PKG.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      # deferred — это НЕ успех: job честно красный, но его результат уже
      # записан в logs/report-<pkg>.json, и reconcile не потеряет его из-за
      # соседнего пакета. not-in-wave — штатная пустота (уже опубликован),
      # она зелёная: волне нечего было делать.
      - name: Package conclusion (deferred is not success)
        if: always()
        env:
          PKG: ${{ matrix.pkg.name }}
        run: |
          set -euo pipefail
          OUTCOME=$(python3 -c "import json;print(json.load(open('logs/report-$PKG.json'))['items'][0].get('outcome','unknown'))" 2>/dev/null || echo unknown)
          echo "outcome=$OUTCOME rc=${{ steps.exec.outputs.rc }}"
          case "$OUTCOME" in
            promoted) echo "::notice::$PKG => promoted" ;;
            not-in-wave) echo "::notice::$PKG => не требует публикации (цель уже достигнута)" ;;
            deferred) echo "::warning::$PKG => deferred (COPR не успел; resubmit не делаем, build id сохранён)"
                     exit 1 ;;
            *) echo "::error::$PKG => $OUTCOME"; exit 1 ;;
          esac

      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-logs-${{ github.run_number }}-${{ matrix.pkg.name }}
          path: logs/

  # ---------------------------------------------------------------------------
  # 3. Reconcile: агрегирует отчёты, гоняет гейты и синхронизирует state/SPECS.
  #
  #    Ключевое: этот job выполняется ВСЕГДА (if: always()). Раньше sync был под
  #    if: success(), поэтому таймаут одного долгого build'а съедал и гейт, и
  #    публикацию версий остальных пакетов.
  # ---------------------------------------------------------------------------
  reconcile:
    name: reconcile wave
    needs: [plan, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container: fedora:44
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          set -euo pipefail
          mkdir -p logs
          dnf install -y jq git gh rpm-build rpmdevtools dnf-plugins-core python3 \
            > logs/dnf-install.log 2>&1 \
            || { echo "dnf install failed:"; tail -20 logs/dnf-install.log; exit 1; }
          tail -3 logs/dnf-install.log

      - name: Collect wave artifacts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: publish-logs-${{ github.run_number }}-*
          path: collected
          merge-multiple: true

      # P0: исходный план волны. Склеенные отчёты обязаны сверяться с ним —
      # иначе дубль имени молча перекрывает другой отчёт, а лишний или
      # пропущенный пакет вообще незаметен. Артефакт содержит содержимое logs/.
      - name: Download wave plan
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wave-plan-${{ github.run_number }}
          path: plan-artifact

      - name: Merge per-package reports
        id: merge
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_SIZE: ${{ needs.plan.outputs.plan_size }}
        run: |
          set -euo pipefail
          mkdir -p logs
          cp -f collected/report-*.json logs/ 2>/dev/null || true

          # P0: сверка отчётов с ИСХОДНЫМ планом — раньше wave-report и
          # тем более до state sync. Раньше набор name+target нигде не
          # сверялся, и «волна чиста» можно было получить при расхождении
          # с тем, что plan-job реально решил.
          PLAN_JSON="plan-artifact/plan.json"
          [ -f "$PLAN_JSON" ] && cp -f "$PLAN_JSON" logs/plan.json
          python3 bin/wave_report_gate.py \
            --plan "$PLAN_JSON" --reports 'logs/report-*.json'

          # Безопасные пути «пусто» и «упало» не должны быть одним и тем же:
          #   * пустой план (plan_size=0) — штатное «нечего публиковать», успех;
          #   * отчётов нет при непустом плане, или plan упал — это ПРОВАЛ,
          #     и промолчать «волна пуста» означало бы скрытый успех.
          N=$(ls logs/report-*.json 2>/dev/null | wc -l)
          if [ "$N" -eq 0 ]; then
            if [ "$PLAN_RESULT" = "success" ] && [ "${PLAN_SIZE:-1}" = "0" ]; then
              echo "пустой план (plan_size=0) — отчётов не будет, это успех"
              python3 -c 'import json;json.dump({"items":[],"counts":{},"deferred":[],"stale_targets":[]},open("logs/wave-report.json","w"),ensure_ascii=False,indent=2)'
              exit 0
            fi
            echo "::error::отчётов пакетов нет при plan=$PLAN_RESULT size=${PLAN_SIZE:-?} — рано говорить «успех»"
            exit 1
          fi

          python3 - <<'PY' | tee logs/merge.log
          import glob, json, os
          items, stale = {}, []
          for path in sorted(glob.glob("logs/report-*.json")):
              r = json.load(open(path))
              stale.extend(r.get("stale_targets") or [])
              for it in r.get("items", []):
                  items[it["name"]] = it
          wave = {"items": list(items.values()),
                  "deferred": sorted(i["name"] for i in items.values()
                                     if i.get("outcome") == "deferred"),
                  "stale_targets": stale}
          from collections import Counter
          wave["counts"] = dict(Counter(i.get("outcome", "?") for i in wave["items"]))
          json.dump(wave, open("logs/wave-report.json", "w"),
                    ensure_ascii=False, indent=2)
          print("counts:", json.dumps(wave["counts"], ensure_ascii=False))
          print("deferred:", wave["deferred"])
          for i in wave["items"]:
              print(f"  {i['name']}: {i.get('outcome')} "
                    f"pilot={i.get('pilot_build','-')} stable={i.get('stable_build','-')}")
          PY

      - name: Auto-issue (failures из волны + deferred + failed в stable)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          echo "== wave-report =="
          if [ -f logs/wave-report.json ]; then
            python3 - <<'PY'
          import json, os, subprocess
          r = json.load(open("logs/wave-report.json"))
          bad = [e for e in r.get("items", []) if e.get("outcome") != "promoted"]
          if bad:
              body = ("**Волна auto-publish: не-чистые исходы**\n\n"
                      + "\n".join(f"- `{e['name']}`: `{e.get('outcome')}` "
                                  f"pilot={e.get('pilot_build','-')} "
                                  f"stable={e.get('stable_build','-')} "
                                  f"{e.get('error','')}"
                                  for e in bad)
                      + f"\n\nRun: {os.environ.get('RUN_URL','')}")
              subprocess.run(["gh", "issue", "create", "--title",
                              "Wave failures (auto-publish channel)", "--body", body],
                             check=False)
          else:
              print("нет не-чистых исходов в волне")
          PY
          fi
          echo "== stable failed реестр =="
          bin/auto-issue.sh || true

      # Гейт не теряется из-за таймаута: job запускается always(), а внутри мы
      # фиксируем ровно те цели, которые реально опубликованы (outcome=promoted).
      # deferred/3-4 в state/SPECS НЕ попадают — иначе репозиторий будет врать
      # о том, что опубликовано.
      #
      # P0 — три раздельных шага: generate -> validate -> commit.
      # Раньше гейт стоял ПОСЛЕ git commit/push: git status уже был чистым, и
      # проверка фактически подтверждала пустое дерево, ничего не говоря о том,
      # что волна собиралась закоммитить.
      - name: Generate state/SPECS for PUBLISHED packages only
        id: generate
        env:
          GH_TOKEN: ${{ secrets.CANDY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory '*' 2>/dev/null || true
          git fetch -q origin master
          PROMOTE=$(python3 - <<'PY'
          import json
          r = json.load(open("logs/wave-report.json"))
          print(" ".join(f"{i['name']}@{i.get('target','')}"
                         for i in r.get("items", [])
                         if i.get("outcome") == "promoted" and i.get("target")))
          PY
          )
          echo "promoted=$PROMOTE" >> "$GITHUB_OUTPUT"
          if [ -z "$PROMOTE" ]; then
            echo "Нет promoted-пакетов — state/SPECS не трогаем"
            exit 0
          fi
          echo "Синхронизирую только фактически опубликованные: $PROMOTE"
          PROMOTE="$PROMOTE" SYNC_LIST="$RUNNER_TEMP/sync-targets" python3 - <<'PY'
          import json, os, pathlib, time
          targets = {}
          for tok in os.environ["PROMOTE"].split():
              name, _, ver = tok.partition("@")
              if name and ver:
                  targets[name] = ver
          path = pathlib.Path("state/state.json")
          state = json.loads(path.read_text())
          now = int(time.time())
          for name, ver in targets.items():
              entry = state.setdefault(name, {})
              entry["ver"] = ver
              entry["ts"] = now
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n")
          print("state обновлён для:", sorted(targets))
          # По одной паре на строку: gen_specs читает построчно.
          with open(os.environ["SYNC_LIST"], "w", encoding="utf-8") as fh:
              for name, ver in sorted(targets.items()):
                  fh.write(f"{name} {ver}\n")
          PY
          while read -r name ver; do
            [ -z "$name" ] && continue
            echo "gen_specs: $name@$ver"
            python3 bin/gen_specs.py "$name" "$ver"
          done < "$RUNNER_TEMP/sync-targets"
          echo "--- рабочее дерево после генерации (до коммита) ---"
          git status --porcelain -- state/state.json SPECS/ pkgs.json || true

      # P0: валидация ТОЧНОГО diff'а в рабочем дереве, МЕЖДУ генерацией и
      # коммитом. Порядок внутри шага тоже важен: сначала regen_gate.py
      # (может перегенерировать SPECS), затем wave_sync_gate.py, который
      # проверяет уже финальное дерево — иначе гейт одобрил бы дерево,
      # отличное от коммитимого.
      - name: Validate exact sync diff before commit (regen gate)
        id: regen-check
        if: always() && steps.generate.outcome == 'success' && steps.generate.outputs.promoted != ''
        env:
          PROMOTED: ${{ steps.generate.outputs.promoted }}
        run: |
          set -uo pipefail
          REGEN_GATE=ok
          if python3 bin/regen_gate.py; then
            echo "regen-gate: spec-set + идемпотентность ok"
          else
            REGEN_GATE=fail
            echo "::error::regen-gate провален — commit state/SPECS и auto-merge запрещены" >&2
          fi

          SYNC_GATE=ok
          if python3 bin/wave_sync_gate.py --promoted "$PROMOTED" --base HEAD; then
            echo "sync-gate: diff ровно из promoted-пакетов"
          else
            SYNC_GATE=fail
            echo "::error::sync-diff содержит пути/ключи вне promoted-набора — коммит запрещён"
          fi

          echo "regen_gate=$REGEN_GATE" >> "$GITHUB_OUTPUT"
          echo "sync_gate=$SYNC_GATE" >> "$GITHUB_OUTPUT"

      - name: Commit state/SPECS and open PR (only after gate passed)
        id: sync
        if: success() && steps.generate.outputs.promoted != '' && steps.regen-check.outputs.regen_gate == 'ok' && steps.regen-check.outputs.sync_gate == 'ok'
        env:
          GH_TOKEN: ${{ secrets.CANDY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- state/state.json SPECS/ pkgs.json)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          # Что именно коммитим — печатаем, чтобы ревью видело состав.
          git status --porcelain -- state/state.json SPECS/ pkgs.json
          BRANCH="candy-bot/publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git remote add origin "$REMOTE_URL" 2>/dev/null || git remote set-url origin "$REMOTE_URL"
          git config user.name "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add -A -- state/state.json SPECS/ pkgs.json
          git commit -qm "publish sync: state targets + specs after wave ${GITHUB_RUN_ID}"
          if ! git push origin "HEAD:refs/heads/$BRANCH"; then
            echo "ERROR: git push failed for $BRANCH" >&2
            exit 1
          fi
          if PR_URL=$(gh pr create --base master --head "$BRANCH" \
               --title "publish sync: wave targets regenerated" \
               --body "Autogenerated sync of state.json/SPECS for packages actually published (exact 4/4). Reviewable PR — no direct push to master." 2>&1); then
            echo "PR created: $PR_URL"
            echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          else
            # Ветка уже запушена, но PR не создан: публикация state/SPECS не
            # состоялась как РЕВЬЮИРУЕМАЯ. Раньше это было warning-only, и
            # reconcile оставался зелёным при фактически неопубликованном sync.
            echo "::error::gh pr create не удался — ветка $BRANCH запушена, но PR не создан; state/SPECS не опубликованы как ревьюируемые"
            echo "$PR_URL" >&2
            echo "FAIL: PR create failed для $BRANCH" >&2
            exit 1
          fi


      # Автомердж включается только когда гейт прошёл уже по СГЕНЕРИРОВАННОМУ
      # diff'у. Если шага sync не было (нет promoted), pr_url пуст — шаг
      # пропускается, а не «успешно» молчит.
      - name: Enable auto-merge only when regen gate passed
        if: always() && steps.sync.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.CANDY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.sync.outputs.pr_url }}
          REGEN_GATE: ${{ steps.regen-check.outputs.regen_gate }}
        run: |
          set -uo pipefail
          if [ "$REGEN_GATE" = "ok" ]; then
            gh pr merge "$PR_URL" --auto --squash --delete-branch \
              || echo "WARN: auto-merge не включён (checks ещё не зелёные — это штатно)" >&2
          else
            echo "INFO: auto-merge отключён (regen-gate не пройден по сгенерированному diff)"
          fi

      - name: Telegram notification
        if: always()
        run: |
          set -euo pipefail
          CHAT_ID=""
          BOT_TOKEN=""
          if [ -f ~/.config/candy/tg.conf ]; then
            CHAT_ID=$(grep -oP 'TG_CHAT_ID=\K.*' ~/.config/candy/tg.conf | head -1)
            BOT_TOKEN=$(grep -oP 'TG_BOT_TOKEN=\K.*' ~/.config/candy/tg.conf | head -1)
          fi
          CHAT_ID="${CHAT_ID:-${{ secrets.TG_CHAT_ID }}}"
          BOT_TOKEN="${BOT_TOKEN:-${{ secrets.TG_BOT_TOKEN }}}"
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            COUNTS=$(python3 -c "import json;print(json.load(open('logs/wave-report.json'))['counts'])" 2>/dev/null || echo '{}')
            MSG="🤖 <b>candy pilot→stable wave</b>: ${COUNTS}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" -d parse_mode=HTML -d text="$MSG" >/dev/null 2>&1 || true
          fi

      - name: Upload merged logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wave-summary-${{ github.run_number }}
          path: logs/

      # P0: провал ЛЮБОГО гейта обязан ронять reconcile, а не только
      # отключать auto-merge. Сценарий regen=fail, sync=ok раньше завершался
      # зелёным: regen-check всегда выходил с кодом 0 (вердикт шёл в outputs),
      # и check'у оставался только warn в логе. Шаг стоит последним, чтобы
      # диагностика и артефакты успели залиться, но run не мог закончиться
      # «успехом» с неожиданным коммитом.
      - name: Fail reconcile when a sync/regen gate rejected the diff
        if: always() && (steps.regen-check.outputs.sync_gate == 'fail' || steps.regen-check.outputs.regen_gate == 'fail')
        run: |
          if [ "${{ steps.regen-check.outputs.regen_gate }}" = "fail" ]; then
            echo "::error::regen_gate=fail — regen/спеки не прошли валидацию, commit запрещён"
          fi
          if [ "${{ steps.regen-check.outputs.sync_gate }}" = "fail" ]; then
            echo "::error::sync_gate=fail — sync-diff вне promoted-набора, commit запрещён"
          fi
          exit 1

  # Итог run'а: красный, если что-то не promoted. deferred тоже красный —
  # успешным он станет только когда пакет реально закроется.
  finalize:
    name: wave result
    needs: [plan, package, reconcile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: wave-summary-${{ github.run_number }}
          path: logs

      - name: Fail unless every package is promoted
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PKG_RESULT: ${{ needs.package.result }}
          RECONCILE_RESULT: ${{ needs.reconcile.result }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN_RESULT package=$PKG_RESULT reconcile=$RECONCILE_RESULT"
          # Упавший plan означает, что волну вообще не планировали: молчаливо
          # «успешного» отчёта быть не должно.
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan не завершился успешно ($PLAN_RESULT) — волна не выполнена"
            exit 1
          fi
          if [ ! -f logs/wave-report.json ]; then
            echo "::error::нет logs/wave-report.json — отчёты пакетов не собраны"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          r = json.load(open("logs/wave-report.json"))
          items = r.get("items", [])
          if not items:
              print("волна пуста (нечего публиковать) — это успех")
              sys.exit(0)
          bad = [i for i in items if i.get("outcome") not in ("promoted", "not-in-wave")]
          for i in bad:
              print(f"::error::{i['name']}: {i.get('outcome')} {i.get('error','')}")
          print("deferred (ждали COPR, resubmit не делаем):", r.get("deferred", []))
          print("итог:", json.dumps(r.get("counts", {}), ensure_ascii=False))
          sys.exit(1 if bad else 0)
          PY