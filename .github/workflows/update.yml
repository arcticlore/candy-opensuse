name: pilot→stable wave publish (opensuse)
# Волновой автоматический конвейер openSUSE:
#   ежедневный schedule + ручной dispatch — ТОЛЬКО новые версии (цели из
#   state.json, не достигнутые зелёным в pilot) и волна размером max_wave.
#   Каждый пакет: fresh SRPM -> pilot (exact 4/4) -> тот же SRPM -> stable
#   (exact 4/4). Жёсткий гейт: failed/canceled/skipped/missing/timeout/API-error
#   никогда не считаются успехом и НЕ продвигают пакет в stable.
#   Безопасность:
#   - пустая волна / «уже всё зелёное» => закончить без действий;
#   - активные сборки в pilot/stable НЕ дублируются (resume по build id);
#   - --force (полный ребилд) только вручную и с confirm_full_rebuild=true;
#   - emergency brake: переменная репозитория CANDY_PUBLISH_PAUSE=true останавливает.
#   - bot PR (state+SPECS) авто-мержится ТОЛЬКО при exact-regen diff и зелёных
#     required checks; при любых не-чистых исходах волны — PR без auto-merge.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      max_wave:
        description: "Размер волны (сколько пакетов обрабатывать за run)."
        required: false
        type: string
        default: "5"
      full_rebuild:
        description: "Полный ребилд (--force) ВСЕХ enabled-пакетов. Требует confirm_full_rebuild=true."
        required: false
        type: boolean
        default: false
      confirm_full_rebuild:
        description: "ЯВНОЕ ПОДТВЕРЖДЕНИЕ полного/всех-пакетов ребилда. Без true — abort до submit."
        required: false
        type: boolean
        default: false
      stable_project:
        description: "Стабильный COPR-проект (allowlist-guarded; менять нельзя)."
        required: false
        type: string
        default: "arcticlore/candy-opensuse"
      pilot_project:
        description: "Pilot-проект (allowlist-guarded)."
        required: false
        type: string
        default: "arcticlore/candy-opensuse-pilot"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    container: fedora:44
    environment: candy-production
    concurrency:
      group: opensuse-auto-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Scope check (allowlists + emergency brake + force confirm)
        id: scope
        env:
          FORCE: ${{ inputs.full_rebuild }}
          CONFIRM_FULL: ${{ inputs.confirm_full_rebuild }}
          MAX_WAVE: ${{ inputs.max_wave }}
          STABLE_PROJECT: ${{ inputs.stable_project }}
          PILOT_PROJECT: ${{ inputs.pilot_project }}
          CANDY_PUBLISH_PAUSE: ${{ vars.CANDY_PUBLISH_PAUSE }}
        run: |
          set -euo pipefail
          if [ "${CANDY_PUBLISH_PAUSE:-false}" = "true" ]; then
            echo "ABORT: repo variable CANDY_PUBLISH_PAUSE=true (emergency brake)" >&2
            exit 1
          fi
          if [ "$STABLE_PROJECT" != "arcticlore/candy-opensuse" ]; then
            echo "ABORT: STABLE_PROJECT=$STABLE_PROJECT вне allowlist" >&2
            exit 1
          fi
          if [ "$PILOT_PROJECT" != "arcticlore/candy-opensuse-pilot" ]; then
            echo "ABORT: PILOT_PROJECT=$PILOT_PROJECT вне allowlist" >&2
            exit 1
          fi
          if [ "$FORCE" = "true" ] && [ "$CONFIRM_FULL" != "true" ]; then
            echo "ABORT: full_rebuild=true требует confirm_full_rebuild=true" >&2
            exit 1
          fi
          case "$MAX_WAVE" in
            ''|*[!0-9]*) echo "ABORT: max_wave должен быть числом ($MAX_WAVE)" >&2; exit 1 ;;
          esac
          if [ "$MAX_WAVE" -lt 1 ] || [ "$MAX_WAVE" -gt 25 ]; then
            echo "ABORT: max_wave вне диапазона 1..25 (получили $MAX_WAVE)" >&2
            exit 1
          fi
          FORCE_FLAG=""
          [ "$FORCE" = "true" ] && FORCE_FLAG="--force"
          echo "force_flag=$FORCE_FLAG" >> "$GITHUB_OUTPUT"
          echo "max_wave=$MAX_WAVE" >> "$GITHUB_OUTPUT"
          echo "SCOPE_OK wave=$MAX_WAVE force=${FORCE:-false}"

      - name: Install toolchain
        run: |
          set -euo pipefail
          mkdir -p logs
          dnf install -y jq git gh rpm-build rpmdevtools dnf-plugins-core python3 golang \
            cargo rust copr-cli nodejs24 nodejs24-npm-bin > logs/dnf-install.log 2>&1 \
            || { echo "dnf install failed:"; tail -20 logs/dnf-install.log; exit 1; }
          tail -5 logs/dnf-install.log
          gh --version
          mv logs/dnf-install.log logs/dnf-install-full.log

      - name: Configure COPR
        run: |
          set -euo pipefail
          COPR_CONF="$RUNNER_TEMP/copr-publish.conf"
          umask 077
          printf '%s\n' "${{ secrets.COPR_CONFIG }}" > "$COPR_CONF"
          chmod 600 "$COPR_CONF"
          echo "COPR_CONFIG_PATH=$COPR_CONF" >> "$GITHUB_ENV"
          echo "COPR config: $COPR_CONF ($(wc -c < "$COPR_CONF") bytes)"
          # API token для copr_waiter (чтение chroot-состояний).
          if [ -n "${{ secrets.COPR_API_TOKEN }}" ]; then
            echo "${{ secrets.COPR_API_TOKEN }}" > "$RUNNER_TEMP/copr-api-token"
            chmod 600 "$RUNNER_TEMP/copr-api-token"
            echo "COPR_API_TOKEN_PATH=$RUNNER_TEMP/copr-api-token" >> "$GITHUB_ENV"
          fi

      - name: Generate specs (из pkgs.json; идемпотентный)
        run: python3 bin/gen_specs.py --all

      - name: Refresh upstream versions (цели волны из state.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 bin/coprase-status.py versions 2>&1 | tee logs/versions.log

      - name: Restore SRPM cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            SRPMS/
            SOURCES/
          # Ключ = хэш источников правды, от которых зависит содержимое SRPM.
          # restore-keys намеренно НЕТ: стейл-SRPM недопустим.
          key: srpm-cache-${{ hashFiles('pkgs.json', 'bin/gen_specs.py', 'bin/make-srpm.sh') }}
          enableCrossOsArchive: true

      - name: Execute wave (fresh SRPM -> pilot exact-4/4 -> stable exact-4/4)
        id: wave
        env:
          COPR_STABLE: ${{ inputs.stable_project }}
          COPR_PILOT: ${{ inputs.pilot_project }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
          WAVE_MAX: ${{ steps.scope.outputs.max_wave }}
          # assert-переменная: никогда не переопределяем из inputs.
          CANDY_STABLE_FIXED: arcticlore/candy-opensuse
        run: |
          set -o pipefail
          FORCE_FLAG="${{ steps.scope.outputs.force_flag }}"
          echo "=== auto-publish plan (preview) ==="
          python3 bin/auto-publish.py plan --max-wave "$WAVE_MAX" ${FORCE_FLAG} 2>&1 | tee logs/plan.log
          echo "=== auto-publish run ==="
          python3 bin/auto-publish.py run --max-wave "$WAVE_MAX" ${FORCE_FLAG} \
            2>&1 | tee logs/publish.log || { echo "WAVE_FAILED"; exit 1; }
          echo "wave_clean=true" >> "$GITHUB_OUTPUT"

      - name: Verify exact-regen idempotency (gate перед auto-merge)
        id: regen-check
        run: |
          set -euo pipefail
          # Идемпотентность ТУЛА: два подряд прогона gen_specs не меняют дерево SPECS.
          # (diff vs HEAD здесь не применим: state.json законно накапливает новые версии.)
          python3 bin/gen_specs.py --all > /dev/null
          before=$(find SPECS -type f -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1)
          python3 bin/gen_specs.py --all > /dev/null
          after=$(find SPECS -type f -exec sha256sum {} + | sort | sha256sum | cut -d' ' -f1)
          if [ "$before" = "$after" ]; then
            echo "idempotent=true" >> "$GITHUB_OUTPUT"
            echo "SPECS/state: точный реген-дифф (идемпотентно)"
          else
            echo "idempotent=false" >> "$GITHUB_OUTPUT"
            echo "WARN: gen_specs не идемпотентен — auto-merge отключён" >&2
          fi

      - name: Auto-issue (failures из волны + failed в stable)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -u
          echo "== wave-report =="
          if [ -f logs/wave-report.json ]; then
            python3 - <<'PY'
          import json, os, subprocess
          r = json.load(open("logs/wave-report.json"))
          bad = [e for e in r.get("items", []) if e.get("outcome") not in ("promoted", "srpm-skip")]
          if bad:
              body = ("**Волна auto-publish: не-чистые исходы**\n\n"
                      + "\n".join(f"- `{e['name']}`: `{e.get('outcome')}` {e.get('error','')}"
                                  for e in bad)
                      + f"\n\nRun: {os.environ.get('RUN_URL','')}")
              title = "Wave failures (auto-publish channel)"
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body],
                             check=False)
          else:
              print("нет не-чистых исходов в волне")
          PY
          fi
          echo "== stable failed реестр =="
          bin/auto-issue.sh || true

      - name: Commit state/SPECS via bot branch + reviewable PR; auto-merge только exact+green
        if: success()
        env:
          GH_TOKEN: ${{ secrets.CANDY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GITHUB_WORKSPACE в контейнере не всегда указывает на git-дерево;
          # берём корень репо из текущей рабочей директории шага (она и есть репо).
          ROOT="$(git rev-parse --show-toplevel)"
          cd "$ROOT"
          git config --global --add safe.directory "$ROOT" 2>/dev/null || true
          git config user.name "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add state/state.json pkgs.json SPECS/ 2>&1 || true
          echo "Files staged:"
          git diff --cached --stat || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="candy-bot/publish-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -qb "$BRANCH" 2>/dev/null || git switch -c "$BRANCH"
          git commit -qm "publish sync: state targets + specs after wave ${{ steps.wave.outputs.wave_clean || 'true' }}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git push origin "HEAD:$BRANCH"; then
            echo "ERROR: git push failed for $BRANCH" >&2
            exit 1
          fi
          PR_URL=$(gh pr create --base master --head "$BRANCH" \
               --title "publish sync: wave targets regenerated" \
               --body "Autogenerated sync of state.json/SPECS from a pilot→stable wave run (exact 4/4 gate). Reviewable PR — no direct push to master." \
               || { echo "ERROR: gh pr create failed" >&2; exit 1; })
          echo "PR created: $PR_URL"
          # Auto-merge ТОЛЬКО при точном реген-диффе (идемпотентно).
          if [ "${{ steps.regen-check.outputs.idempotent }}" = "true" ]; then
            gh pr merge "$BRANCH" --auto --squash --delete-branch \
              || echo "WARN: auto-merge не включён (checks ещё не зелёные — это штатно)" >&2
          else
            echo "INFO: auto-merge отключён (regen не идемпотентен)"
          fi

      - name: Telegram notification
        if: always()
        run: |
          CHAT_ID=""
          BOT_TOKEN=""
          if [ -f ~/.config/candy/tg.conf ]; then
            CHAT_ID=$(grep -oP 'TG_CHAT_ID=\K.*' ~/.config/candy/tg.conf | head -1)
            BOT_TOKEN=$(grep -oP 'TG_BOT_TOKEN=\K.*' ~/.config/candy/tg.conf | head -1)
          fi
          CHAT_ID="${CHAT_ID:-${{ secrets.TG_CHAT_ID }}}"
          BOT_TOKEN="${BOT_TOKEN:-${{ secrets.TG_BOT_TOKEN }}}"
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            STATUS="${{ job.status }}"
            MSG="🤖 <b>candy pilot→stable wave</b>: ${STATUS}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" -d parse_mode=HTML -d text="$MSG" >/dev/null 2>&1 || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: publish-logs-${{ github.run_number }}
          path: logs/