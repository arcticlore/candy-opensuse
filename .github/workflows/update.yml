name: submit to copr (opensuse beta)
# CONTAINMENT (bp pause-production-submit): автоматический production submit
# ОТКЛЮЧЁН. schedule-триггер удалён — запуск возможен только вручную через
# workflow_dispatch и только с явным подтверждением scope.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Пакеты через запятую (пилот). Пусто = ЗАПРЕЩЕНО без confirm_full_rebuild."
        required: false
        type: string
        default: ""
      full_rebuild:
        description: "Полный ребилд (--force) ВСЕХ enabled-пакетов. Требует отдельного подтверждения confirm_full_rebuild=true."
        required: false
        type: boolean
        default: false
      confirm_full_rebuild:
        description: "ЯВНОЕ ПОДТВЕРЖДЕНИЕ полного/всех-пакетов ребилда. Без true — abort до submit."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: fedora:44
    environment: candy-production
    concurrency:
      group: submit-production-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Scope check — no implicit bulk submit, force needs explicit confirmation
        id: scope
        env:
          CANDY_ONLY_INPUT: ${{ inputs.only }}
          FORCE: ${{ inputs.full_rebuild }}
          CONFIRM_FULL: ${{ inputs.confirm_full_rebuild }}
        run: |
          set -euo pipefail
          # 1) Пустой only НЕ означает «все пакеты». Нужно явное подтверждение.
          if [ -z "$CANDY_ONLY_INPUT" ]; then
            if [ "$CONFIRM_FULL" != "true" ]; then
              echo "ABORT: пустой 'only' не означает все пакеты; подтверди полный ребилд (confirm_full_rebuild=true)" >&2
              exit 1
            fi
            echo "SCOPE: ALL enabled packages (explicitly confirmed)"
          else
            echo "SCOPE: pilot subset only=[$CANDY_ONLY_INPUT]"
          fi
          # 2) --force требует отдельного явного подтверждения.
          if [ "$FORCE" = "true" ] && [ "$CONFIRM_FULL" != "true" ]; then
            echo "ABORT: full_rebuild=true требует confirm_full_rebuild=true" >&2
            exit 1
          fi
          FORCE_FLAG=""
          [ "$FORCE" = "true" ] && FORCE_FLAG="--force"
          echo "force_flag=$FORCE_FLAG" >> "$GITHUB_OUTPUT"
          echo "SCOPE_OK"
      - name: Install toolchain
        run: |
          mkdir -p logs
          dnf install -y jq git rpm-build rpmdevtools dnf-plugins-core python3 golang \
            cargo rust copr-cli nodejs24 nodejs24-npm-bin > logs/dnf-install.log 2>&1 \
            || { echo "dnf install failed:"; tail -20 logs/dnf-install.log; exit 1; }
          tail -5 logs/dnf-install.log
          mv logs/dnf-install.log logs/dnf-install-full.log

      - name: Configure COPR
        run: |
          mkdir -p ~/.config
          echo "${{ secrets.COPR_CONFIG }}" > ~/.config/copr
          chmod 600 ~/.config/copr

      - name: Generate specs
        run: python3 bin/gen_specs.py --all

      - name: Refresh upstream versions (цели для сабмита)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDY_ONLY: ${{ inputs.only }}
        run: python3 bin/coprase-status.py versions 2>&1 | tee logs/versions.log

      - name: Restore SRPM cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            SRPMS/
            SOURCES/
          # Ключ = хэш источников правды, от которых зависит содержимое SRPM:
          # pkgs.json (версии/BR/bins), генератор spec и скрипт сборки SRPM.
          # Любое их изменение инвалидирует кэш и форсирует пересборку SRPM
          # для пакетов со статусом submission. restore-keys намеренно НЕТ:
          # префикс подтянул бы стейл-SRPM (собранные до фикса perl/noman/install)
          # и снова отправил бы их в COPR.
          key: srpm-cache-${{ hashFiles('pkgs.json', 'bin/gen_specs.py', 'bin/make-srpm.sh') }}

      - name: Build SRPMs for packages needing submission
        env:
          CANDY_ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          echo "=== Building/rebuilding SRPMs for packages needing submission ==="
          CHECK=$(python3 bin/coprase-status.py check 2>&1)
          echo "$CHECK" | tee logs/check.log
          TO_SUBMIT=$(echo "$CHECK" | grep -E "has SRPM|no SRPM" | awk '{print $1}' || true)

          BUILT=0
          FAILED=0
          SKIPPED=0
          for name in $TO_SUBMIT; do
            target=$(jq -r --arg n "$name" '.[$n].ver // ""' state/state.json)
            if [ -z "$target" ]; then
              echo "  [SKIP] $name: нет цели в state.json"
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            if ls SRPMS/$name-$target-*.src.rpm >/dev/null 2>&1; then
              echo "  [FINE] $name: SRPM уже на цели $target"
              continue
            fi
            echo "  [BUILD SRPM] $name ($target)"
            if bin/make-srpm.sh "$name" "$target" > "logs/srpm-$name.log" 2>&1; then
              echo "  [OK] $name ($target)"
              BUILT=$((BUILT+1))
            else
              rc=$?
              echo "  [FAIL] $name (rc=$rc) — хвост лога:"
              tail -8 "logs/srpm-$name.log" | sed 's/^/    /'
              FAILED=$((FAILED+1))
            fi
          done

          CACHED=$(ls SRPMS/*.src.rpm 2>/dev/null | wc -l)
          echo "=== SRPMs: built=$BUILT failed=$FAILED skipped=$SKIPPED cached=$CACHED (полные логи: logs/srpm-*.log) ==="

      # NOTE: dnf builddep guard (bin/check-deps.sh) is Fedora-only and is
      # intentionally skipped in this openSUSE beta repo.

      - name: Submit to COPR (dedup with version comparison, allowlist-guarded)
        env:
          CANDY_ONLY: ${{ inputs.only }}
          PROJECT_ALLOWLIST: arcticlore/candy-opensuse-beta
        run: |
          set -euo pipefail
          # Allowlist: единственный допустимый production-проект.
          if [ -n "${COPR_PROJECT:-}" ] && [ "$COPR_PROJECT" != "$PROJECT_ALLOWLIST" ]; then
            echo "ABORT: COPR_PROJECT=$COPR_PROJECT вне allowlist ($PROJECT_ALLOWLIST)" >&2
            exit 1
          fi
          FORCE_FLAG="${{ steps.scope.outputs.force_flag }}"
          python3 bin/coprase-status.py submit ${FORCE_FLAG} 2>&1 | tee logs/submit.log

      # NOTE: auto-triage is Fedora-specific (hardcoded Fedora chroots and the
      # arcticlore/candy project) — disabled in the openSUSE beta for now.
      - name: Auto-triage (skipped in beta)
        if: always()
        run: echo "auto-triage is Fedora-specific; skipped in openSUSE beta"

      - name: Auto-issue (report failures)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/auto-issue.sh || true

      - name: Commit state via bot branch + reviewable PR (no direct push to master)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          git config user.name "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          git add state/state.json pkgs.json SPECS/ 2>&1 || true
          echo "Files staged:"
          git diff --cached --stat || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          BRANCH="candy-bot/submit-sync-${GITHUB_RUN_ID}"
          git checkout -qb "$BRANCH" 2>/dev/null || git switch -c "$BRANCH"
          git commit -qm "submit sync: state/version targets regenerated [skip ci]"
          git push origin "HEAD:$BRANCH" 2>&1 | tail -3
          gh pr create --base master --head "$BRANCH" \
            --title "submit sync: state targets regenerated" \
            --body "Autogenerated sync of state.json/SPECS from a production submit run. Reviewable PR — no direct push to master." \
            2>&1 | tail -2 || echo "PR create failed (non-critical)"

      - name: Telegram notification
        if: always()
        run: |
          if [ -f ~/.config/candy/tg.conf ]; then
            CHAT_ID=$(grep -oP 'TG_CHAT_ID=\K.*' ~/.config/candy/tg.conf | head -1)
            BOT_TOKEN=$(grep -oP 'TG_BOT_TOKEN=\K.*' ~/.config/candy/tg.conf | head -1)
          fi
          CHAT_ID="${CHAT_ID:-${{ secrets.TG_CHAT_ID }}}"
          BOT_TOKEN="${BOT_TOKEN:-${{ secrets.TG_BOT_TOKEN }}}"
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            STATUS="${{ job.status }}"
            MSG="🤖 <b>candy submit</b>: ${STATUS}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d chat_id="$CHAT_ID" -d parse_mode=HTML -d text="$MSG" >/dev/null 2>&1 || true
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: submit-logs-${{ github.run_number }}
          path: logs/