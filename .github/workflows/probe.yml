name: probe (opensuse packaging intel)
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe.yml"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Probe openSUSE macros & conventions
        run: |
          docker run --rm registry.opensuse.org/opensuse/tumbleweed bash -ec '
            zypper -n refresh >/dev/null 2>&1 || true
            zypper -n install -y rpm-build rpm python3 >/dev/null 2>&1 || true

            echo "@@@@@ PACKAGES @@@@@"
            for p in ruby-devel rubygem-gem2rpm python311-devel python-rpm-macros \
                     python311-rpm-macros python313-rpm-macros cargo-packaging rust-packaging \
                     rust cargo zig nodejs-packaging golang-packaging ncurses-devel \
                     libjpeg8-devel python311-dbus-python python311-distro python311-netifaces \
                     python311-setproctitle ; do
              if zypper -n --no-refresh install -y "$p" >/dev/null 2>&1; then echo "OK      $p"; else echo "MISSING $p"; fi
            done

            echo "@@@@@ MACROS @@@@@"
            for m in mod_name mod_full_name gem_dir gem_cache ruby_gem_dir rb_ver gem_install \
                     cargo_prep cargo_build cargo_install cargo_generate_buildrequires \
                     pyproject_buildrequires pyproject_save_files pyproject_files pyproject_install \
                     pyproject_wheel python_sitelib python_sitearch python3_sitelib python_bindir ; do
              v=$(rpm -E "%${m}" 2>/dev/null)
              if [ "$v" = "%${m}" ]; then echo "UNDEF %${m}"; else echo "DEF   %${m} = $(printf "%s" "$v" | head -c 100)"; fi
            done

            echo "@@@@@ MACRO FILES @@@@@"
            grep -rnsE "cargo_prep|cargo_build|cargo_install|mod_full_name|gem_dir|pyproject_files|pyproject_save_files|pyproject_buildrequires" \
              /usr/lib/rpm/macros.d/ /usr/lib/rpm/*.macros /usr/lib/rpm/rpmrc 2>/dev/null | head -100

            echo "@@@@@ GEM LAYOUT @@@@@"
            ruby -e "puts Gem.default_dir" 2>/dev/null || echo "no ruby"
            echo "--- gem2rpm files ---"
            rpm -ql rubygem-gem2rpm 2>/dev/null | head -40
            echo "--- gem2rpm templates (authoritative %files) ---"
            for t in $(find /usr/share/gem2rpm -type f 2>/dev/null | head -10); do echo "### $t"; cat "$t"; done

            echo "@@@@@ EXAMPLE INSTALLED GEM @@@@@"
            for g in rubygem-trollop rubygem-mustache rubygem-json ; do
              if zypper -n --no-refresh install -y "$g" >/dev/null 2>&1; then echo "### $g"; rpm -ql "$g" | head -30; break; fi
            done

            echo "@@@@@ NAME LOOKUPS @@@@@"
            echo "--- ncurses devel ---"; zypper -n se -s ncurses-devel 2>/dev/null | head
            echo "--- dbus python ---"; zypper -n se -s "*dbus-python*" 2>/dev/null | head
            echo "--- pyproject packages ---"; zypper -n se -s -x pyproject 2>/dev/null | head
            echo "--- rust-packaging content ---"; rpm -ql rust-packaging 2>/dev/null | head -30
            echo "@@@@@ DONE @@@@@"
          ' 2>&1 | tee probe-output.txt
      - uses: actions/upload-artifact@v7
        with:
          name: probe-output
          path: probe-output.txt
