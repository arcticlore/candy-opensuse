name: sync specs (opensuse)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Целевая ветка для коммита (по умолчанию master при dispatch)"
        required: false
        type: string
        default: "master"
  push:
    branches: ["ci/**"]

concurrency:
  group: sync-specs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 1
          persist-credentials: false

      - name: Regenerate specs
        run: python3 bin/gen_specs.py --all

      - name: Commit regenerated SPECS (bot branch + PR for master, direct push only to ci/**)
        env:
          # CANDY_BOT_TOKEN (PAT): события, аутентифицированные PAT, могут
          # триггерить downstream CI. GITHUB_TOKEN fallback: рекурсивные workflow
          # runs могут подавляться, required checks могут остаться absent/pending
          # — путь fail-closed, но не автоматизированный.
          GH_TOKEN: ${{ secrets.CANDY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          # Единый выбранный токен для ЛЮБОГО write-path (master-PR и ci/** direct),
          # чтобы PAT, если задан, триггерил CI и на финальном head.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git diff --quiet -- SPECS/; then
            echo "SPECS/ уже синхронизирован с генератором"
            exit 0
          fi
          git add SPECS/
          git diff --cached --stat | tail -5
          git commit -qm "regen: synchronize SPECS/ with gen_specs.py"
          echo "Pushing to branch: ${TARGET_REF}"
          if [ "$TARGET_REF" = "master" ]; then
            BRANCH="candy-bot/sync-specs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git checkout -qb "$BRANCH" 2>/dev/null || git switch -c "$BRANCH"
            if ! git push origin "HEAD:$BRANCH"; then
              echo "ERROR: git push failed for $BRANCH" >&2
              exit 1
            fi
            if ! gh pr create --base master --head "$BRANCH" \
                 --title "regen: synchronize SPECS/ with gen_specs.py" \
                 --body "Autogenerated SPECS sync. Reviewable PR — no direct push to master."; then
              echo "ERROR: gh pr create failed for $BRANCH" >&2
              exit 1
            fi
          else
            if ! git push origin "HEAD:${TARGET_REF}"; then
              echo "ERROR: git push failed for ${TARGET_REF}" >&2
              exit 1
            fi
          fi
