name: sync specs (opensuse beta)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Целевая ветка для коммита (по умолчанию master при dispatch)"
        required: false
        type: string
        default: "master"
  push:
    branches: ["ci/**"]

concurrency:
  group: sync-specs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.ref || '' }}
          fetch-depth: 1

      - name: Regenerate specs
        run: python3 bin/gen_specs.py --all

      - name: Commit regenerated SPECS (bot branch + PR for master, direct push only to ci/**)
        env:
          # CANDY_BOT_TOKEN (fine-grained PAT) при наличии даёт CI без ручного
          # approve на bot-PR; fallback GITHUB_TOKEN создаёт checks в
          # approval-required состоянии.
          GH_TOKEN: ${{ secrets.CANDY_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          git config user.name "candy-bot"
          git config user.email "candy-bot@users.noreply.github.com"
          if git diff --quiet -- SPECS/; then
            echo "SPECS/ уже синхронизирован с генератором"
            exit 0
          fi
          git add SPECS/
          git diff --cached --stat | tail -5
          git commit -qm "regen: synchronize SPECS/ with gen_specs.py"
          echo "Pushing to branch: ${TARGET_REF}"
          if [ "$TARGET_REF" = "master" ]; then
            BRANCH="candy-bot/sync-specs-${GITHUB_RUN_ID}"
            git checkout -qb "$BRANCH" 2>/dev/null || git switch -c "$BRANCH"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin "HEAD:$BRANCH" 2>&1 | tail -3
            gh pr create --base master --head "$BRANCH" \
              --title "regen: synchronize SPECS/ with gen_specs.py" \
              --body "Autogenerated SPECS sync. Reviewable PR — no direct push to master." \
              2>&1 | tail -2 || echo "PR create failed (non-critical)"
          else
            git push origin "HEAD:${TARGET_REF}" 2>&1 | tail -3
          fi