name: validate (opensuse stable)
on:
  push:
    branches: [master, "ci/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decommission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: AZ-5 fully decommissioned (no file, gates, or refs)
        run: |
          set -euo pipefail
          hits=$(rg -l -i 'AZ5|AZ-5|АЗ-5|АЗ5' . --glob '!.git/**' --glob '!**/__pycache__/**' || true)
          if [ -z "$hits" ]; then
            echo "OK: no AZ-5 references remain"
          else
            echo "FAIL: AZ-5 references still present:" >&2
            echo "$hits" >&2
            exit 1
          fi
          if [ -e AZ5 ]; then
            echo "FAIL: AZ5 stop file still exists" >&2
            exit 1
          fi
          echo "OK: no AZ5 stop file"
      - name: Production workflows have no AZ-5 gate dependency
        run: |
          set -euo pipefail
          # Проверяем только производственные workflows; validate.yml исключён,
          # т.к. его собственный статический pattern содержит эти слова.
          for wf in \
            .github/workflows/update.yml \
            .github/workflows/logrotate.yml \
            .github/workflows/sync-specs.yml \
            .github/workflows/pilot-build.yml ; do
            if grep -qE 'AZ5|AZ-5|АЗ-5|guard\.outputs|needs\.guard' "$wf"; then
              echo "FAIL: $wf still depends on AZ-5/guard" >&2
              exit 1
            fi
          done
          echo "OK: no production workflow depends on AZ-5/guard"

  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Required 4-chroot drift check (repo vs stable vs pilot)
        run: |
          python3 bin/drift-check.py
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Generate specs
        run: python3 bin/gen_specs.py --all
      - name: Idempotency (regen must be a no-op)
        run: |
          python3 bin/gen_specs.py --all
          if git diff --exit-code -- SPECS/ >/dev/null; then
            echo "OK: SPECS/ после повторной генерации не изменился"
          else
            echo "FAIL: gen_specs.py --all неидемпотентен" >&2
            git diff --stat -- SPECS/ >&2
            exit 1
          fi
      - name: No Fedora-only macros in generated specs
        run: |
          bad=0
          for m in cargo_prep pyproject_buildrequires pyproject_save_files pyproject_files pyproject_extras_subpkg gem_dir gem_cache ruby_gem_dir; do
            if grep -rl "%$m" SPECS/ > /dev/null 2>&1; then
              echo "FAIL: макрос %$m не должен встречаться в SPECS (openSUSE не предоставляет его)" >&2
              grep -rl "%$m" SPECS/ | head -20 >&2
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then exit 1; else echo "OK: Fedora-макросы отсутствуют"; fi
      - name: Run test suite
        run: python3 -m pytest -q

  opensuse-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro:
          - name: tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed
          - name: leap-16.0
            image: opensuse/leap:16.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Generate specs
        run: python3 bin/gen_specs.py --all
      - name: Validate specs in ${{ matrix.distro.name }}
        run: |
          docker run --rm -v "$PWD":/work:ro -w /work ${{ matrix.distro.image }} bash -ec '
            zypper -n --gpg-auto-import-keys install -y rpm-build rpm python3 > /dev/null 2>&1

            echo "== macro availability =="
            undef=""
            for m in gem_name gem_dir gem_cache gem_install \
                     pyproject_files pyproject_install pyproject_wheel \
                     pyproject_buildrequires pyproject_save_files pyproject_extras_subpkg \
                     cargo_prep cargo_install cargo_build cargo_generate_buildrequires ; do
              v=$(rpm -E "%${m}" 2>/dev/null)
              if [ "$v" = "%${m}" ]; then
                echo "UNDEFINED %${m}"
                undef="$undef %${m}"
              else
                echo "defined   %${m} = $(printf "%s" "$v" | head -c 70)"
              fi
            done
            echo "undef=$undef"

            echo "== unexpanded macros across SPECS (must be 0) =="
            bad=0
            for s in SPECS/*.spec; do
              left=$(rpmspec -P "$s" 2>/dev/null | grep -oE "%\{[A-Za-z_][A-Za-z0-9_]*\}" | sort -u | grep -vx '%{name}\|%{version}\|%{release}' | tr "\n" " ")
              if [ -n "$left" ]; then echo "UNEXPANDED $s :: $left"; bad=$((bad+1)); fi
            done
            echo "unexpanded_specs=$bad"
            [ "$bad" -eq 0 ] || { echo "FAIL: есть нераскрытые макросы"; exit 1; }

            echo "== BuildRequires resolvability (pilot + кандидаты стабильной волны) =="
            miss_total=0
            for p in tealdeer sd yazi broot dua pipes.rs wallust Rio jp2a cyme \
                     archey4 pywal colorls lazygit starship lavat linuxwave \
                     animfetch bacon bottom delta grex hyperfine; do
              s="SPECS/$p.spec"; [ -f "$s" ] || continue
              brs=$(rpmspec -q --buildrequires "$s" 2>/dev/null | tr "\n" " ")
              if [ -n "$brs" ] && ! zypper -n --no-refresh install --dry-run -y $brs > /dev/null 2>&1; then
                miss=""
                for b in $brs; do
                  zypper -n --no-refresh install --dry-run -y "$b" > /dev/null 2>&1 || miss="$miss $b"
                done
                echo "BR-MISSING $p ::$miss"
                miss_total=$((miss_total+1))
              else
                echo "BR-OK $p"
              fi
            done
            echo "br_missing_pkgs=$miss_total"
            [ "$miss_total" -eq 0 ] || { echo "FAIL: есть неразрешимые BuildRequires"; exit 1; }
          '

  waiters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: CLI smoke test — print-build-ids + wait[--help]
        run: |
          set -euo pipefail
          printf 'Created build(s) 123456.' > /tmp/copr-out.txt
          got=$(python3 bin/copr_waiter.py print-build-ids /tmp/copr-out.txt)
          echo "build-id parsed: $got"
          [ "$got" = "123456" ] || { echo "FAIL: unexpected build-id '$got'"; exit 1; }
          python3 bin/copr_waiter.py watch --help > /dev/null
          echo "OK: copr_waiter CLI works"
