name: phase-d inventory
on:
  workflow_dispatch:
    inputs:
      project:
        description: "COPR project to inventory (default: production candy-opensuse-beta)"
        required: false
        type: string
        default: "candy-opensuse-beta"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install test deps
        run: pip install pytest

      - name: Run Phase D inventory (read-only COPR API)
        id: inventory
        env:
          COPR_PROJECT: ${{ inputs.project || 'candy-opensuse-beta' }}
          COPR_API_TOKEN: ${{ secrets.COPR_API_TOKEN }}
        run: |
          python3 -m pytest tests/test_phase_d_inventory.py -q
          python3 bin/phase-d-inventory.py

      - name: Upload inventory reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase-d-inventory-${{ github.run_number }}
          path: reports/opensuse-inventory*.json
          retention-days: 14